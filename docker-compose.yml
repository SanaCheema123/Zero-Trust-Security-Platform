services:

  postgres:
    image: postgres:16-alpine
    container_name: zero-trust-postgres
    environment:
      POSTGRES_USER: security_user
      POSTGRES_PASSWORD: security_password
      POSTGRES_DB: security_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_user -d security_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: zero-trust-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zero-trust-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://security_user:security_password@postgres:5432/security_db
      # Optional integrations (leave unset to use PostgreSQL-only fallback):
      # ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
